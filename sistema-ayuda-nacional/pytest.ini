[pytest]
asyncio_mode = auto

# Las pruebas firman tokens con el secreto de ejemplo (25 bytes), que es
# justo lo que PyJWT ≥2.15 advierte por ser más corto que los 32 bytes que
# pide RFC 7518 §3.2. En producción eso no puede pasar: config_checks se
# niega a arrancar con un JWT_SECRET corto, y hay pruebas de eso. Acá la
# advertencia solo tapa las que sí importan.
filterwarnings =
    ignore::jwt.warnings.InsecureKeyLengthWarning
