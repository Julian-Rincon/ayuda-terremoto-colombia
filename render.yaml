# NOTA sobre `fromDatabase`: la sintaxis de abajo (name/property: connectionString,
# referenciando el `name` de la entrada en `databases:`) sigue el blueprint spec
# publicado por Render (https://render.com/docs/blueprint-spec#fromdatabase) al
# momento de este cambio. No se pudo probar contra la cuenta real de Render (esta
# tarea no crea servicios reales, solo edita este archivo declarativo) — revisar
# que el blueprint valide sin errores en el dashboard de Render antes de desplegar.
databases:
  - name: ayuda-terremoto-db
    plan: free
    databaseName: ayuda_terremoto_nacional
    user: ayuda_terremoto

services:
  - type: web
    name: ayuda-terremoto-nacional
    runtime: python
    rootDir: sistema-ayuda-nacional
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # /salud consulta la base antes de responder 200; si la base no contesta
    # devuelve 503 y Render no da el despliegue por bueno.
    healthCheckPath: /salud
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NODOS_SECRETO_INICIAL
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ayuda-terremoto-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      # WhatsApp: se cargan a mano en el dashboard de Render por quien
      # conecte su número (sync: false = no viajan en el blueprint).
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: USHAHIDI_BASE_URL
        sync: false
