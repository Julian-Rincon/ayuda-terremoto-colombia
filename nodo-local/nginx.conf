server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: cualquier ruta desconocida la resuelve React, no nginx con un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker nunca se cachea: si se cachea, una versión vieja de la
    # PWA puede quedar pegada en el dispositivo de un coordinador.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Los assets con hash en el nombre sí: cambian de nombre al cambiar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
